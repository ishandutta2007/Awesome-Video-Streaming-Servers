<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="stream-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse-live {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      @keyframes wave-bounce-1 {
        0%, 100% { height: 18px; y: 295px; }
        50% { height: 50px; y: 263px; }
      }
      @keyframes wave-bounce-2 {
        0%, 100% { height: 42px; y: 271px; }
        50% { height: 14px; y: 299px; }
      }
      @keyframes wave-bounce-3 {
        0%, 100% { height: 30px; y: 283px; }
        50% { height: 58px; y: 255px; }
      }
      @keyframes wave-bounce-4 {
        0%, 100% { height: 52px; y: 261px; }
        50% { height: 22px; y: 291px; }
      }
      @keyframes stream-dash {
        to { stroke-dashoffset: -120; }
      }
      @keyframes badge-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      .live-dot {
        transform-origin: 1045px 52px;
        animation: pulse-live 1.8s ease-in-out infinite;
      }
      .wave-bar-1 { animation: wave-bounce-1 1.2s ease-in-out infinite; }
      .wave-bar-2 { animation: wave-bounce-2 1.4s ease-in-out infinite 0.2s; }
      .wave-bar-3 { animation: wave-bounce-3 1.1s ease-in-out infinite 0.4s; }
      .wave-bar-4 { animation: wave-bounce-4 1.5s ease-in-out infinite 0.1s; }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: stream-dash 3s linear infinite;
      }
      .floating-badge {
        animation: badge-float 4s ease-in-out infinite;
      }
      .badge-delay-1 { animation-delay: 0.8s; }
      .badge-delay-2 { animation-delay: 1.6s; }
      .badge-delay-3 { animation-delay: 2.4s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" stroke="#1f2937" stroke-width="2" />

  <!-- Subtle Cyber Grid in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="90" r="140" fill="#06b6d4" opacity="0.12" filter="url(#neon-glow)" />
  <circle cx="1020" cy="280" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#neon-glow)" />

  <!-- Dynamic Live Stream Flow Path in Lower Background -->
  <g opacity="0.6">
    <path class="flow-line" d="M 60 320 C 300 270, 480 340, 700 290 C 880 250, 1020 330, 1140 280" 
          fill="none" stroke="url(#stream-flow)" stroke-width="3" />
  </g>

  <!-- Real-time Equalizer Wave Bars (Foreground bottom-left) -->
  <g opacity="0.85">
    <rect class="wave-bar-1" x="70" y="280" width="5" height="30" rx="2" fill="#06b6d4" />
    <rect class="wave-bar-2" x="80" y="270" width="5" height="40" rx="2" fill="#38bdf8" />
    <rect class="wave-bar-3" x="90" y="260" width="5" height="50" rx="2" fill="#818cf8" />
    <rect class="wave-bar-4" x="100" y="275" width="5" height="35" rx="2" fill="#a78bfa" />
    <rect class="wave-bar-1" x="110" y="285" width="5" height="25" rx="2" fill="#c084fc" />
    <rect class="wave-bar-3" x="120" y="265" width="5" height="45" rx="2" fill="#06b6d4" />
    <rect class="wave-bar-2" x="130" y="275" width="5" height="35" rx="2" fill="#38bdf8" />
    <rect class="wave-bar-4" x="140" y="290" width="5" height="20" rx="2" fill="#10b981" />
  </g>

  <!-- Floating Dynamic Protocol Pills (Positioned around borders to avoid obstructing title) -->
  <g class="floating-badge">
    <rect x="70" y="40" width="115" height="28" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.9" />
    <text x="127" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">⚡ WebRTC</text>
  </g>

  <g class="floating-badge badge-delay-1">
    <rect x="200" y="40" width="105" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.9" />
    <text x="252" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">🚀 SRT / RIST</text>
  </g>

  <g class="floating-badge badge-delay-2">
    <rect x="320" y="40" width="105" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <text x="372" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">📡 RTMP / FLV</text>
  </g>

  <g class="floating-badge badge-delay-3">
    <rect x="440" y="40" width="125" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" opacity="0.9" />
    <text x="502" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">🎥 LL-HLS / DASH</text>
  </g>

  <!-- Live Status Beacon in Top Right -->
  <g>
    <rect x="1000" y="38" width="130" height="32" rx="16" fill="#18181b" stroke="#ef4444" stroke-width="1.5" />
    <circle class="live-dot" cx="1020" cy="54" r="5" fill="#ef4444" filter="url(#soft-glow)" />
    <text x="1070" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f87171" letter-spacing="1.5" text-anchor="middle">LIVE CORE</text>
  </g>

  <!-- Main Hero Card Backdrop to Guarantee Unobscured Contrast -->
  <rect x="60" y="95" width="1080" height="150" rx="16" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1" />

  <!-- FOREGROUND TEXT (Always 100% visible, high contrast, top z-index) -->
  <g id="foreground-content">
    <!-- Super Header Badge -->
    <text x="90" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#06b6d4" letter-spacing="2">
      ENTERPRISE &amp; OPEN-SOURCE MEDIA INFRASTRUCTURE
    </text>

    <!-- Main Title -->
    <text x="90" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Video Streaming Servers
    </text>

    <!-- Subtitle -->
    <text x="90" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated Directory of Real-Time Broadcast Engines, Ingest Proxies, WebRTC SFUs &amp; Packaging Origins
    </text>
  </g>

  <!-- Bottom Architecture Pipeline Highlights -->
  <g opacity="0.9" transform="translate(480, 265)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="130" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="65" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">INGEST</text>
    <text x="65" y="32" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">RTMP • SRT • RTSP</text>

    <text x="145" y="25" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle">→</text>

    <!-- Stage 2 -->
    <rect x="160" y="0" width="145" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="232" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">TRANSCODE / PACK</text>
    <text x="232" y="32" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">FFmpeg • ABR • DVR</text>

    <text x="320" y="25" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle">→</text>

    <!-- Stage 3 -->
    <rect x="335" y="0" width="135" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="402" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">DISTRIBUTE</text>
    <text x="402" y="32" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">LL-HLS • WebRTC • CDN</text>

    <text x="485" y="25" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle">→</text>

    <!-- Stage 4 -->
    <rect x="500" y="0" width="130" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="565" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">PLAYBACK</text>
    <text x="565" y="32" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">HLS.js • Video.js • App</text>
  </g>
</svg>
